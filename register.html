<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Halo 2 Trivia</title>
    <link rel="stylesheet" href="login_register.css">
</head>
<body>
    <div id="error-banner" style="color: red; font-weight: bold; margin-bottom: 10px;"></div>

    <div class="login-container">
    <h2>Create an Account</h2>
    <form id="register-form">
        <label>First Name: <input type="text" id="first_name" required></label><br><br>
        <label>Last Name: <input type="text" id="last_name" required></label><br><br>
        <label>Email: <input type="email" id="email" required></label><br><br>
        <label>Password: <input type="password" id="password" required></label><br><br>
        <button type="submit">Register</button>
    </form>
    

    <p style="margin-top: 15px;">Already have an account? <a href="index.html">Log in here</a></p>
    </div>
    <script src="register.js"></script>
</body>
</html>
