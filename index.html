<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Halo 2 Trivia</title>
     <link rel="stylesheet" href="login_register.css" />
</head>
<body>
    <div id="error-banner" style="color: red; font-weight: bold; margin-bottom: 10px;"></div>

    <div class="login-container">
    <h2>Log In to Halo 2 Trivia</h2>
    <form id="login-form">
        <label>Email: <input type="email" id="login-email" required></label><br><br>
        <label>Password: <input type="password" id="login-password" required></label><br><br>
        <button type="submit">Log In</button>
    </form>
    
    <p style="margin-top: 15px;">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
